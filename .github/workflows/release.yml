name: 'Release'

# Release button: Actions -> Release -> Run workflow. Tags SQLite's version from the amalgamation id: 3540100 is 3.54.1
# (or <version>-N for a rebuild of a version released before), builds and pushes the
# image, then creates the tag and GitHub release. Tick "dry run" to see the tag first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (leave empty to work it out from the Dockerfile)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: only work out the tag and build the image'
        type: boolean
        default: false

jobs:
  release:
    uses: 'trexx/actions/.github/workflows/release-image.yml@main'
    permissions:
      contents: 'write'
      packages: 'write'
    with:
      version_command: >-
        sed -n 's/^ENV SQLITE_VERSION="\([0-9]*\)"/\1/p' Dockerfile | awk '{printf "%d.%d.%d", substr($1, 1, 1), substr($1, 2, 2), substr($1, 4, 2)}'
      tag: '${{ inputs.tag }}'
      dry_run: ${{ inputs.dry_run }}
