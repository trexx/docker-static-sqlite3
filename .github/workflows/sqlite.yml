name: 'SQLite'

on:
  schedule:
    - cron: '17 13 * * *'

jobs:
  update:
    runs-on: 'ubuntu-26.04'
    permissions:
      contents: 'write'
      pull-requests: 'write'

    steps:
      - name: 'Checkout'
        uses: 'trexx/actions/.github/actions/checkout@shared-steps'

      # sqlite.org names the amalgamation after a zero padded release id (3.53.4 -> 3530400)
      # and files it under the year it was published. Renovate can derive neither, so the
      # download page is the source of truth for both.
      - name: 'Resolve latest amalgamation'
        id: 'sqlite'
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/download.html" 'https://www.sqlite.org/download.html'

          product="$(grep -m1 -E '^PRODUCT,[0-9.]+,[0-9]{4}/sqlite-amalgamation-[0-9]+\.zip,' "${RUNNER_TEMP}/download.html" || true)"
          if [ -z "${product}" ]; then
            echo '::error::no amalgamation entry found on https://www.sqlite.org/download.html'
            exit 1
          fi

          version="$(echo "${product}" | cut -d, -f2)"
          path="$(echo "${product}" | cut -d, -f3)"
          year="${path%%/*}"
          release="${path#*sqlite-amalgamation-}"
          release="${release%.zip}"

          sed -i \
            -e "s|^ENV SQLITE_VERSION=.*|ENV SQLITE_VERSION=\"${release}\"|" \
            -e "s|^ENV SQLITE_YEAR=.*|ENV SQLITE_YEAR=\"${year}\"|" \
            Dockerfile

          {
            echo "version=${version}"
            echo "year=${year}"
            echo "release=${release}"
            echo "releaselog=$(echo "${version}" | tr '.' '_')"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Open pull request'
        uses: 'trexx/actions/.github/actions/create-pull-request@shared-steps'
        with:
          branch: 'update/sqlite'
          delete-branch: true
          commit-message: 'Update SQLite to ${{ steps.sqlite.outputs.version }}'
          title: 'Update SQLite to ${{ steps.sqlite.outputs.version }}'
          body: |
            [Release notes](https://www.sqlite.org/releaselog/${{ steps.sqlite.outputs.releaselog }}.html)

            Amalgamation: https://www.sqlite.org/${{ steps.sqlite.outputs.year }}/sqlite-amalgamation-${{ steps.sqlite.outputs.release }}.zip
